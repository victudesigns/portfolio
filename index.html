</head>
<body>

        <div class="container">
            <div class="inner-header">
                <a href="#" class="logo">Victu Designs</a>
                <nav>

    <section id="hero">
        <video src="media/bg-video.mp4" autoplay loop muted></video>
        <div class="hero-content">
            <span>welcome to my portfolio</span>
            <h1>Hi my name is <br> Ugochukwu Victor Ogamba

                            <button>Banner Set</button>
                            <button>Illustration</button>
                            <button>Infographic</button>

                        <div class="btn-list web-btns">

                            <button>E-Commerce</button>
                            <button>Landing Page</button>
                            <button>CMS Web App</button>
                            <button>Web Application</button>
                        </div>
                        </div>
                        <div class="work-selecter">
                            <select name="work-list" id="work-list">
                                <option value="" disabled selected>Select a Skill...</option>

                                <option value="Graphics Design">

                            </datalist>
